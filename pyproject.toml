[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fintech-gateway-risk-notifier"
version = "0.1.0"
description = "Assess payment events and draft privacy-conscious audit notifications through an OpenAI-compatible gateway."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.54,<2",
  "pydantic>=2.9,<3",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
payment-risk-service = "payment_risk_service.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/payment_risk_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
